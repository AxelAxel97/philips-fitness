<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile - Philips Fitness</title>
</head>
<body>
    <h1>My Profile</h1>

    <p>
        Subscriber status:
        {% if profile.is_subscriber %}
            Active
        {% else %}
            Not subscribed
        {% endif %}
    </p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Profile</button>
    </form>

    <p><a href="{% url 'logout' %}">Log Out</a></p>
</body>
</html>
