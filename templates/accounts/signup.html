<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Archipelago Rugby</title>
</head>
<body>
    <h1>Join Archipelago Rugby</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign Up</button>
    </form>
    <p><a href="{% url 'login' %}">Already have an account? Log in</a></p>
</body>
</html>
